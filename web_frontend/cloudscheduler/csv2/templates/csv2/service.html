<html>

	<head>
        {% load static %}

        <link rel="stylesheet" type="text/css" href="{% static "csv2/common.css" %}?{{version}}">
        <link rel="stylesheet" type="text/css" href="{% static "csv2/service.css" %}?{{version}}">

	<!-- <meta http-equiv="refresh" content="30"> -->
	</head>


	<body>	
		<form method="post">
                {% csrf_token %}

                <div class="setting-div">
		<div class="setting-table">
                        <table id="settingsTable">
                                <tr class="title-row">
					<th></th>
                                        <th onClick="sortTable(1)">Service &#8597;</th>
                                        <th onClick="sortTable(2)">State &#8597;</th>
                                </tr>
                                {% for setting in service_list %}
					<td><input type="checkbox" name="service_alias" value="{{setting.alias}}" {% if setting.show_status == 1 %}checked{% endif %}></td>
					<td>{{setting.alias}}</td>
					<td>{{setting.state}}</td>
				    </tr>
                    {% endfor %}
			</table>
                </div>
                <div class="footer">
                        {% if response_code == 1 %}
                        <tr>
                                <td><b>Error: {{ message }}</b></td>
                        </tr>
                        {% elif message is not None %}
                        <tr>
                                <td>{{ message }}</td>
                        </tr>
                        {% endif %}
                </div>
          <script type="text/javascript">

		document.querySelectorAll('input[type="checkbox"]').forEach(function(checkbox) {
		    checkbox.addEventListener('change', function() { 
			const form = this.closest('form');
			document.querySelectorAll('.temp-input').forEach(el => el.remove());	
				const actionInput = document.createElement('input'); 
				actionInput.type = 'hidden';
				actionInput.name = 'service_option'; 
				actionInput.value = this.checked ? 'show' : 'hide'; 
				actionInput.classList.add('temp-input'); 
				form.appendChild(actionInput);

				const input = document.createElement('input');
				input.type = 'hidden';
				input.name = 'service_alias';
				input.value = this.value;
				input.classList.add('temp-input');
				form.appendChild(input);

			form.action = '/vm/settings/update/';
			form.submit();
		    });
		});

                        // To sort by clicking the headers
                        function sortTable(n) {
                                var table, rows, switching, i, x, y, shouldSwitch, dir, switchcount = 0;
                                table = document.getElementById("settingsTable");
                                switching = true;
                                // Set the sorting direction to ascending:
                                dir = "asc";
                                /* Make a loop that will continue until
                                no switching has been done: */
                                while (switching) {
                                        // Start by saying: no switching is done:
                                        switching = false;
                                        rows = table.getElementsByTagName("TR");
                                        /* Loop through all table rows (except the
                                        first, which contains table headers): */
                                        for (i = 1; i < (rows.length - 1); i++) {
                                                // Start by saying there should be no switching:
                                                shouldSwitch = false;
                                                /* Get the two elements you want to compare,
                                                one from current row and one from the next: */
                                                x = rows[i].getElementsByTagName("TD")[n];
                                                y = rows[i + 1].getElementsByTagName("TD")[n];
                                                /* Check if the two rows should switch place,
                                                based on the direction, asc or desc: */
                                                if (dir == "asc") {
                                                        if (x.innerHTML.toLowerCase() > y.innerHTML.toLowerCase()) {
                                                                // If so, mark as a switch and break the loop:
                                                                shouldSwitch = true;
                                                                break;
                                                        }
                                                } else if (dir == "desc") {
                                                        if (x.innerHTML.toLowerCase() < y.innerHTML.toLowerCase()) {
                                                                // If so, mark as a switch and break the loop:
                                                                shouldSwitch = true;
                                                                break;
                                                        }
                                                }
                                        }
                                        if (shouldSwitch) {
                                                /* If a switch has been marked, make the switch
                                                and mark that a switch has been done: */
                                                rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
                                                switching = true;
                                                // Each time a switch is done, increase this count by 1:
                                                switchcount++;
                                        } else {
                                                /* If no switching has been done AND the direction is "asc",
                                                set the direction to "desc" and run the while loop again. */
                                                if (switchcount == 0 && dir == "asc") {
                                                        dir = "desc";
                                                        switching = true;
                                                }
                                        }
                                }
                        }

                        // To sort by clicking the headers
                        function sortTableNum(n) {

                                table = document.getElementById("settingsTable");

                                                y_num = parseInt(y.innerHTML, 10)
                                                /* Check if the two rows should switch place,

                                                } else if (dir == "desc") {

                                                                shouldSwitch = true;

                                                        }
                                                }
                                        }
                                        if (shouldSwitch) {
                                                /* If a switch has been marked, make the switch

                                                rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
                                                switching = true;
                                                // Each time a switch is done, increase this count by 1:
                                                switchcount++;
                                        } else {
                                                /* If no switching has been done AND the direction is "asc",

                                                if (switchcount == 0 && dir == "asc") {
                                                        dir = "desc";
                                                        switching = true;
                                                }
                                        }
                                }
                        }


                </script>
</body>

</html>
